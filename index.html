<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Complaint</title>

    <!-- Bootstrap (optional but recommended) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      body {
        background-color: #f4f6f8;
      }
      .card {
        border-radius: 12px;
      }
      #map {
        height: 300px;
        width: 100%;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h2 class="mb-4">Add Complaint</h2>

      <div class="card p-4" style="max-width: 500px">
        <form method="POST" action="#">
          <!-- Complaint Title -->
          <input
            type="text"
            class="form-control mb-3"
            placeholder="Complaint Title"
            required
          />

          <!-- MAP (THIS IS THE EMPTY WHITE BOX IN YOUR SCREENSHOT) -->
          <div id="map"></div>

          <!-- Hidden inputs for latitude & longitude -->
          <input type="hidden" id="latitude" name="latitude" />
          <input type="hidden" id="longitude" name="longitude" />

          <!-- Capture Location Button -->
          <button
            type="button"
            class="btn btn-primary w-100 mt-3"
            onclick="getLocation()"
          >
            Capture Accurate Location
          </button>

          <!-- Category -->
          <select class="form-select mt-3" required>
            <option value="">Select Category</option>
            <option>Garbage</option>
            <option>Water</option>
            <option>Road</option>
          </select>

          <!-- Description -->
          <textarea
            class="form-control mt-3"
            rows="3"
            placeholder="Description"
            required
          ></textarea>

          <!-- Submit -->
          <button class="btn btn-success w-100 mt-3">Submit Complaint</button>
        </form>
      </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      let map;
      let marker;

      /* Initialize Map */
      function initMap(lat = 11.0168, lng = 76.9558) {
        // Default: Coimbatore
        map = L.map("map").setView([lat, lng], 15);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap",
        }).addTo(map);

        marker = L.marker([lat, lng], { draggable: true }).addTo(map);

        document.getElementById("latitude").value = lat;
        document.getElementById("longitude").value = lng;

        // Update when marker dragged
        marker.on("dragend", function () {
          const pos = marker.getLatLng();
          document.getElementById("latitude").value = pos.lat;
          document.getElementById("longitude").value = pos.lng;
        });

        // Update when map clicked
        map.on("click", function (e) {
          marker.setLatLng(e.latlng);
          document.getElementById("latitude").value = e.latlng.lat;
          document.getElementById("longitude").value = e.latlng.lng;
        });
      }

      /* Capture User Location */
      function getLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function (position) {
              const lat = position.coords.latitude;
              const lng = position.coords.longitude;

              map.setView([lat, lng], 18);
              marker.setLatLng([lat, lng]);

              document.getElementById("latitude").value = lat;
              document.getElementById("longitude").value = lng;
            },
            function () {
              alert("Location access denied. Please adjust manually.");
            },
            { enableHighAccuracy: true }
          );
        } else {
          alert("Geolocation not supported");
        }
      }

      /* Load Map on Page Load */
      window.onload = function () {
        initMap();
      };
    </script>
  </body>
</html>
